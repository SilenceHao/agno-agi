<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d12" />
    <title>AGNO</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=agent-mark-v1" />
    <link rel="stylesheet" href="/static/styles.css?v=s-logo-v1" />
    <link rel="stylesheet" href="/static/vendor/github-dark.min.css" />
    <link rel="stylesheet" href="/static/markdown.css?v=image-lightbox-v2" />
    <link rel="stylesheet" href="/static/knowledge.css?v=chat-knowledge-toggle-v1" />
    <link rel="stylesheet" href="/static/sidebar.css?v=sidebar-toggle-v2" />
    <link rel="stylesheet" href="/static/settings.css?v=conversation-confirm-v1" />
    <link rel="stylesheet" href="/static/layout.css?v=chat-composer-fixed-v1" />
    <link rel="stylesheet" href="/static/ui-polish.css?v=workflow-picker-v1" />
    <link rel="stylesheet" href="/static/auth.css?v=auth-startup-v1" />
  </head>
  <body>
    <div class="startup-screen" id="startup-screen" role="status" aria-label="正在加载工作区">
      <div class="startup-mark" aria-hidden="true">S</div>
      <span class="startup-label">正在加载工作区</span>
    </div>
    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" aria-label="应用导航">
        <div class="sidebar-heading">
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="打开导航" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <a class="brand" href="/" aria-label="智能体首页">
            <div class="brand-mark" aria-hidden="true">S</div>
            <span class="brand-name">Silence</span>
          </a>
          <button class="sidebar-collapse" id="sidebar-collapse" type="button" aria-label="收起侧边栏" aria-expanded="true" title="收起侧边栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 5v14M14 9l-3 3 3 3"/></svg></button>
        </div>
        <button class="new-chat" id="new-chat" type="button" title="开始新对话" aria-label="开始新对话"><span class="new-chat-label">新对话</span></button>
        <div class="sidebar-label history-heading"><span>最近对话</span><span id="conversation-count">0</span></div>
        <div class="conversation-list" id="conversation-list" aria-label="最近对话"></div>
        <div class="account-menu-wrap" id="account-menu-wrap">
          <button class="account-menu-trigger" id="account-menu-trigger" type="button" aria-label="账号菜单" aria-haspopup="menu" aria-expanded="false">
            <span class="settings-avatar" id="account-avatar" aria-hidden="true">U</span>
            <span class="settings-user-label"><strong id="account-name">账号</strong><small id="account-role">普通用户</small></span>
            <svg class="account-menu-dots" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
          <div class="account-menu" id="account-menu" role="menu" hidden>
            <button class="settings-trigger" id="admin-workbench-trigger" type="button" role="menuitem" hidden>
              <svg class="settings-trigger-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4z"/><path d="M4 9.5h16M8 9.5v9M12 12.5h5M12 15.5h5"/></svg><span>管理工作台</span>
            </button>
            <button class="logout-trigger" id="logout-trigger" type="button" role="menuitem">退出登录</button>
          </div>
        </div>
      </aside>
      <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="关闭导航" hidden></button>

      <main class="main-panel">
        <header class="topbar">
          <div class="breadcrumb"><span>工作区</span><span class="crumb-sep">/</span><strong id="active-title">新对话</strong></div>
        </header>

        <section class="chat-layout" id="chat-layout" aria-label="智能体对话">
          <p class="sr-only" id="stream-status" role="status" aria-live="polite"></p>
          <div class="conversation" id="conversation" aria-live="off">
            <div class="welcome" id="welcome">
              <h1>Hi. How can I help?</h1>
            </div>
            <div class="message-list" id="message-list"></div>
          </div>

          <form class="composer-wrap" id="chat-form">
            <div class="file-list" id="file-list" aria-live="polite"></div>
            <div class="composer">
              <textarea id="message-input" rows="1" placeholder="给智能体发送消息…" aria-label="给智能体发送消息"></textarea>
              <div class="composer-tools">
                <div class="tool-left">
                  <input id="file-input" type="file" accept=".pdf,.docx,.txt,.md,.jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple hidden />
                  <button class="attach-btn" id="attach-button" type="button" aria-label="添加附件" title="附件仅用于当前对话，不会加入知识库。支持 PDF、DOCX、TXT、MD、JPEG、PNG、WebP。"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5 12 20a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
                  <button class="thinking-toggle" id="thinking-toggle" type="button" aria-pressed="false" title="开启后将增加回答时间与模型用量" aria-label="开启深度思考"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M8.2 14.5A6.5 6.5 0 1 1 15.8 14.5c-.8.6-1.3 1.4-1.5 2.5h-4.6c-.2-1.1-.7-1.9-1.5-2.5Z"/><path d="M12 4v2M5.8 7.1l1.4 1.4M18.2 7.1l-1.4 1.4"/></svg><span>深度思考</span></button>
                  <select class="workflow-select" id="workflow-select" aria-label="选择工作流" hidden><option value="">普通对话</option></select>
                  <label class="knowledge-toggle"><input id="knowledge-enabled" type="checkbox" checked /><span>检索知识库</span></label>
                </div>
                <button class="send-btn" id="send-button" type="submit" aria-label="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg></button>
              </div>
            </div>
            <div class="composer-note">模型回答可能有误，请核对重要信息。</div>
          </form>
        </section>

      </main>
    </div>
    <dialog class="image-lightbox" id="image-lightbox" aria-label="图片预览" aria-describedby="image-lightbox-caption">
      <div class="image-lightbox-content">
        <button class="image-lightbox-close" id="image-lightbox-close" type="button" aria-label="关闭图片预览" autofocus>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
        <img id="image-lightbox-image" alt="" />
        <p class="image-lightbox-caption" id="image-lightbox-caption"></p>
        <span class="image-lightbox-zoom-level" id="image-lightbox-zoom-level" aria-live="polite">100%</span>
      </div>
    </dialog>
    <section class="confirm-overlay" id="confirm-overlay" hidden>
      <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <div class="confirm-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></div>
        <div class="confirm-copy"><h2 id="confirm-title">删除这条对话？</h2><p id="confirm-message">消息和附件提取文本也会从本机记录中删除。</p></div>
        <div class="confirm-actions"><button class="confirm-cancel" id="confirm-cancel" type="button">取消</button><button class="confirm-delete" id="confirm-delete" type="button">删除对话</button></div>
      </div>
    </section>
    <section class="auth-overlay" id="auth-overlay" aria-label="账号登录" hidden>
      <div class="auth-card">
        <div class="auth-brand" aria-hidden="true">S</div>
        <p class="auth-eyebrow">SILENCE AGENT</p>
        <h1 id="auth-title">欢迎回来</h1>
        <p class="auth-description" id="auth-description">登录后继续使用你的智能体工作区。</p>
        <div class="auth-mode-tabs" role="tablist" aria-label="登录或注册">
          <button class="auth-mode active" id="auth-login-mode" type="button" role="tab" aria-selected="true">登录</button>
          <button class="auth-mode" id="auth-register-mode" type="button" role="tab" aria-selected="false">注册账号</button>
        </div>
        <form id="auth-form" novalidate>
          <label for="auth-username">账号</label>
          <input id="auth-username" name="username" type="text" minlength="3" maxlength="64" autocomplete="username" required placeholder="输入账号" />
          <label for="auth-password">密码</label>
          <input id="auth-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required placeholder="输入密码" />
          <p class="auth-hint" id="auth-hint" hidden>密码至少 8 位。账号 16602024093 注册后将成为超级管理员。</p>
          <p class="auth-error" id="auth-error" role="alert" hidden></p>
          <button class="auth-submit" id="auth-submit" type="submit">登录</button>
        </form>
      </div>
    </section>
    <script src="/static/vendor/marked.min.js" defer></script>
    <script src="/static/vendor/highlight.common.min.js" defer></script>
    <script src="/static/vendor/purify.min.js" defer></script>
    <script src="/static/app.js?v=workflow-run-v1" defer></script>
  </body>
</html>
